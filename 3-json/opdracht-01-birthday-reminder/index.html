<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday reminder</title>

  <!-- Font awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Google fonts library -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Poppins -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <main>

    <section class="birthday-reminder-sec" id="birthday-reminder-sec">
      <button class="clear-btn">
        <i class="fa-regular fa-trash-can"></i>
        Clear all
      </button>

      <h1>Birthday <span>Reminder.</span></h1>
      
      <div>
        <p class="upcoming-birthdays"><span id="upcoming-birthdays"></span> upcoming birthdays</p>
        <div class="birthday-sec">

          <div class="sidebar">
            <div class="card-wrapper">
              <!-- Javascript renders cards here -->
            </div>
          </div>

          <div class="featured">
            <!-- Javascript renders featured card here -->
          </div>
        </div>
      </div>
    </section>

    <section class="nothing-found hidden" id="nothing-found">
      <div class="wrapper">
        <img src="./assets/images/nothing-found.png">
        <h1>No upcoming <span>birthdays.</span></h1>
      </div>
    </section>
  </main>
</body>
</html>
